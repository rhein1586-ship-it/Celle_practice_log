<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>첼로 연습일지 (Cello Practice Log)</title>
  <style>
    :root {
      --bg-dark: #121316;
      --card-bg: #1c1e24;
      --card-border: #2e323d;
      --accent-gold: #d4af37;
      --accent-gold-hover: #f1c40f;
      --text-main: #f0f2f5;
      --text-sub: #9ca3af;
      --danger: #e74c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--accent-gold);
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
    }

    .stat-title {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--text-main);
    }

    .stat-value span {
      font-size: 0.9rem;
      color: var(--text-sub);
      font-weight: normal;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
    }

    .card-title {
      font-size: 1.2rem;
      color: var(--accent-gold);
      margin-bottom: 16px;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    input[type="text"], input[type="date"], textarea {
      width: 100%;
      background-color: #141518;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-gold);
    }

    /* 루틴별 세부 횟수 입력 그리드 */
    .routine-count-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .routine-count-item {
      background-color: #141518;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .routine-label {
      font-size: 0.85rem;
      color: var(--text-main);
    }

    .mini-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-btn {
      background: #2a2e38;
      border: none;
      color: var(--text-main);
      width: 26px;
      height: 26px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .mini-btn:hover {
      background-color: var(--accent-gold);
      color: #000;
    }

    .mini-display {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--accent-gold);
      min-width: 28px;
      text-align: center;
    }

    .btn {
      background-color: var(--accent-gold);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-gold-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: #2a2e38;
    }

    .routine-box {
      background-color: #141518;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
    }

    .routine-item {
      margin-bottom: 12px;
    }

    .routine-item:last-child {
      margin-bottom: 0;
    }

    .routine-tag {
      display: inline-block;
      font-size: 0.75rem;
      background-color: rgba(212, 175, 55, 0.15);
      color: var(--accent-gold);
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    .routine-desc {
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .history-section {
      margin-top: 24px;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    th {
      color: var(--text-sub);
      font-weight: 500;
      background-color: #16171c;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.85rem;
    }

    .backup-actions {
      display: flex;
      gap: 8px;
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .file-input-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
    }

    .badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      background-color: #2a2e38;
      color: var(--accent-gold);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>🎻 첼로 연습일지</h1>
      <p class="subtitle">기록하고, 돌아보고, 더 나아가기</p>
    </div>
    <div class="backup-actions">
      <button class="btn btn-secondary" onclick="exportJSON()">JSON 백업</button>
      <button class="btn btn-secondary" onclick="exportCSV()">CSV 엑셀 저장</button>
      <div class="file-input-wrapper">
        <button class="btn btn-secondary">JSON 불러오기</button>
        <input type="file" id="importFile" accept=".json" onchange="importJSON(event)">
      </div>
    </div>
  </header>

  <!-- 통계 대시보드 -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-title">이번 주 연습 시간</div>
      <div class="stat-value" id="weeklyMin">0<span> 분</span></div>
      <div class="stat-title" style="margin-top: 4px;">목표 315분</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">연속 연습 달성</div>
      <div class="stat-value" id="streakDays">0<span> 일 연속</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-title">이번 주 연습일</div>
      <div class="stat-value" id="weeklyDays">0<span> 일</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-title">총 누적 연습</div>
      <div class="stat-value" id="totalMin">0<span> 분</span></div>
    </div>
  </div>

  <div class="main-grid">
    <!-- 연습 기록 입력 폼 -->
    <div class="card">
      <div class="card-title">오늘의 연습 기록</div>
      <form id="logForm">
        <div class="form-group">
          <label for="logDate">연습 날짜</label>
          <input type="date" id="logDate" required>
        </div>

        <div class="form-group">
          <label for="logPiece">연습 곡명</label>
          <input type="text" id="logPiece" placeholder="예: 윌리엄 텔 서곡, 파헬벨 캐논" required>
        </div>

        <div class="form-group">
          <label>연습 시간: <strong id="timeDisplay" style="color: var(--accent-gold);">45분</strong></label>
          <div class="slider-container">
            <input type="range" id="logDuration" min="5" max="180" step="5" value="45" oninput="updateTimeDisplay(this.value)">
          </div>
        </div>

        <!-- 세부 루틴별 횟수 입력 섹션 -->
        <div class="form-group">
          <label>루틴별 연습 횟수 설정</label>
          <div class="routine-count-grid">
            <div class="routine-count-item">
              <span class="routine-label">손풀기</span>
              <div class="mini-control">
                <button type="button" class="mini-btn" onclick="adjustRoutineCount('warmup', -1)">-</button>
                <span class="mini-display" id="cnt-warmup">0회</span>
                <button type="button" class="mini-btn" onclick="adjustRoutineCount('warmup', 1)">+</button>
              </div>
            </div>
            <div class="routine-count-item">
              <span class="routine-label">테크닉</span>
              <div class="mini-control">
                <button type="button" class="mini-btn" onclick="adjustRoutineCount('tech', -1)">-</button>
                <span class="mini-display" id="cnt-tech">0회</span>
                <button type="button" class="mini-btn" onclick="adjustRoutineCount('tech', 1)">+</button>
              </div>
            </div>
            <div class="routine-count-item">
              <span class="routine-label">부분 연습</span>
              <div class="mini-control">
                <button type="button" class="mini-btn" onclick="adjustRoutineCount('part', -1)">-</button>
                <span class="mini-display" id="cnt-part">0회</span>
                <button type="button" class="mini-btn" onclick="adjustRoutineCount('part', 1)">+</button>
              </div>
            </div>
            <div class="routine-count-item">
              <span class="routine-label">전체 연습</span>
              <div class="mini-control">
                <button type="button" class="mini-btn" onclick="adjustRoutineCount('full', -1)">-</button>
                <span class="mini-display" id="cnt-full">0회</span>
                <button type="button" class="mini-btn" onclick="adjustRoutineCount('full', 1)">+</button>
              </div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="logMemo">오늘의 메모</label>
          <textarea id="logMemo" rows="3" placeholder="잘된 점, 어려웠던 부분, 내일 이어갈 내용을 적어보세요."></textarea>
        </div>

        <button type="submit" class="btn">💾 연습 기록 저장</button>
      </form>
    </div>

    <!-- 곡별 맞춤 루틴 생성기 -->
    <div class="card">
      <div class="card-title">곡별 맞춤 루틴 생성기</div>
      <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 12px;">
        연습 곡명을 입력하고 생성 버튼을 누르면 맞춤 루틴을 제안합니다.
      </p>

      <div class="form-group">
        <input type="text" id="customPieceInput" placeholder="예: 슈만 두 사람의 척탄병">
      </div>

      <button class="btn btn-secondary" onclick="generateRoutine()">✨ 루틴 생성</button>

      <div class="routine-box" id="routineResult" style="display: none;">
        <h4 id="routinePieceTitle" style="color: var(--accent-gold); margin-bottom: 12px; font-size: 1rem;"></h4>
        
        <div class="routine-item">
          <div class="routine-tag">1단계: 조성 스케일</div>
          <div class="routine-desc" id="rtScale"></div>
        </div>
        <div class="routine-item">
          <div class="routine-tag">2단계: 아티큘레이션</div>
          <div class="routine-desc" id="rtArtic"></div>
        </div>
        <div class="routine-item">
          <div class="routine-tag">3단계: 붓점 리듬</div>
          <div class="routine-desc" id="rtRhythm"></div>
        </div>
        <div class="routine-item">
          <div class="routine-tag">4단계: 부분 연습 순서</div>
          <div class="routine-desc" id="rtSection"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 연습 기록 목록 -->
  <div class="card history-section">
    <div class="card-title">연습 일지 목록</div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>날짜</th>
            <th>곡명</th>
            <th>연습 시간</th>
            <th>세부 루틴 횟수</th>
            <th>메모</th>
            <th>삭제</th>
          </tr>
        </thead>
        <tbody id="historyTableBody">
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let practiceLogs = JSON.parse(localStorage.getItem('celloLogs') || '[]');
  
  let routineCounts = {
    warmup: 0,
    tech: 0,
    part: 0,
    full: 0
  };

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('logDate').valueAsDate = new Date();
    renderAll();
  });

  function updateTimeDisplay(val) {
    document.getElementById('timeDisplay').innerText = val + '분';
  }

  function adjustRoutineCount(type, delta) {
    routineCounts[type] = Math.max(0, routineCounts[type] + delta);
    document.getElementById(`cnt-${type}`).innerText = routineCounts[type] + '회';
  }

  document.getElementById('logForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const date = document.getElementById('logDate').value;
    const piece = document.getElementById('logPiece').value.trim();
    const duration = parseInt(document.getElementById('logDuration').value);
    const memo = document.getElementById('logMemo').value.trim();

    const newLog = {
      id: Date.now(),
      date,
      piece,
      duration,
      routineDetails: { ...routineCounts },
      memo
    };

    practiceLogs.unshift(newLog);
    saveData();
    renderAll();

    // 폼 초기화
    document.getElementById('logPiece').value = '';
    document.getElementById('logMemo').value = '';
    routineCounts = { warmup: 0, tech: 0, part: 0, full: 0 };
    ['warmup', 'tech', 'part', 'full'].forEach(type => {
      document.getElementById(`cnt-${type}`).innerText = '0회';
    });
  });

  function deleteLog(id) {
    if (confirm('이 연습 기록을 삭제하시겠습니까?')) {
      practiceLogs = practiceLogs.filter(log => log.id !== id);
      saveData();
      renderAll();
    }
  }

  function saveData() {
    localStorage.setItem('celloLogs', JSON.stringify(practiceLogs));
  }

  function renderAll() {
    renderHistory();
    calculateStats();
  }

  function renderHistory() {
    const tbody = document.getElementById('historyTableBody');
    tbody.innerHTML = '';

    if (practiceLogs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--text-sub);">저장된 연습 기록이 없습니다.</td></tr>';
      return;
    }

    practiceLogs.forEach(log => {
      const tr = document.createElement('tr');
      
      const rd = log.routineDetails || {};
      const badges = [];
      if (rd.warmup) badges.push(`<span class="badge">손풀기 ${rd.warmup}회</span>`);
      if (rd.tech) badges.push(`<span class="badge">테크닉 ${rd.tech}회</span>`);
      if (rd.part) badges.push(`<span class="badge">부분연습 ${rd.part}회</span>`);
      if (rd.full) badges.push(`<span class="badge">전체연습 ${rd.full}회</span>`);

      const badgeHTML = badges.length > 0 ? `<div class="badge-group">${badges.join('')}</div>` : '-';

      tr.innerHTML = `
        <td>${log.date}</td>
        <td><strong>${escapeHtml(log.piece)}</strong></td>
        <td>${log.duration}분</td>
        <td>${badgeHTML}</td>
        <td>${escapeHtml(log.memo || '-')}</td>
        <td><button class="action-btn" onclick="deleteLog(${log.id})">삭제</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function calculateStats() {
    const totalMin = practiceLogs.reduce((acc, log) => acc + log.duration, 0);
    
    let totalSessions = 0;
    practiceLogs.forEach(log => {
      const rd = log.routineDetails || {};
      totalSessions += (rd.warmup || 0) + (rd.tech || 0) + (rd.part || 0) + (rd.full || 0);
    });

    document.getElementById('totalMin').innerHTML = `${totalMin}<span> 분 (총 ${totalSessions}회)</span>`;

    const now = new Date();
    const startOfWeek = new Date(now);
    startOfWeek.setDate(now.getDate() - now.getDay());
    startOfWeek.setHours(0, 0, 0, 0);

    const weeklyLogs = practiceLogs.filter(log => new Date(log.date) >= startOfWeek);
    const weeklyMin = weeklyLogs.reduce((acc, log) => acc + log.duration, 0);
    document.getElementById('weeklyMin').innerHTML = `${weeklyMin}<span> 분</span>`;

    const uniqueDays = new Set(weeklyLogs.map(log => log.date));
    document.getElementById('weeklyDays').innerHTML = `${uniqueDays.size}<span> 일</span>`;

    let streak = 0;
    const sortedDates = [...new Set(practiceLogs.map(l => l.date))].sort().reverse();
    let checkDate = new Date();

    for (let i = 0; i < sortedDates.length; i++) {
      const dStr = checkDate.toISOString().split('T')[0];
      if (sortedDates.includes(dStr)) {
        streak++;
        checkDate.setDate(checkDate.getDate() - 1);
      } else if (i === 0) {
        checkDate.setDate(checkDate.getDate() - 1);
        const yesterdayStr = checkDate.toISOString().split('T')[0];
        if (sortedDates.includes(yesterdayStr)) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else {
          break;
        }
      } else {
        break;
      }
    }
    document.getElementById('streakDays').innerHTML = `${streak}<span> 일 연속</span>`;
  }

  function generateRoutine() {
    const title = document.getElementById('customPieceInput').value.trim();
    if (!title) {
      alert('곡명을 입력해주세요.');
      return;
    }

    document.getElementById('routineResult').style.display = 'block';
    document.getElementById('routinePieceTitle').innerText = `[${title}] 맞춤 루틴 제안`;

    document.getElementById('rtScale').innerText = `'${title}'의 주요 조성 스케일 및 2옥타브/3옥타브 아르페지오 음정 점검`;
    document.getElementById('rtArtic').innerText = `활 위치 고정 및 레가토/스타카토 아티큘레이션 분리 연습`;
    document.getElementById('rtRhythm').innerText = `어려운 패시지 구간 붓점 및 역붓점 리듬 변형 연습`;
    document.getElementById('rtSection').innerText = `어려운 마디 4개 선정 후 템포 늦추어 반복 후 정상 템포 도달`;
  }

  function exportJSON() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(practiceLogs, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `cello_practice_logs_${new Date().toISOString().split('T')[0]}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function exportCSV() {
    let csv = "\uFEFF날짜,곡명,연습시간(분),손풀기(회),테크닉(회),부분연습(회),전체연습(회),메모\n";
    practiceLogs.forEach(log => {
      const rd = log.routineDetails || {};
      csv += `"${log.date}","${log.piece.replace(/"/g, '""')}",${log.duration},${rd.warmup || 0},${rd.tech || 0},${rd.part || 0},${rd.full || 0},"${(log.memo || '').replace(/"/g, '""')}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cello_practice_logs_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
  }

  function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const imported = JSON.parse(e.target.result);
        if (Array.isArray(imported)) {
          practiceLogs = imported;
          saveData();
          renderAll();
          alert('연습일지 데이터를 성공적으로 복원했습니다.');
        } else {
          alert('올바르지 않은 JSON 데이터 형식입니다.');
        }
      } catch (err) {
        alert('파일을 읽는 중 오류가 발생했습니다.');
      }
    };
    reader.readAsText(file);
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
</script>
